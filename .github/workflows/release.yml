name: Release

# Builds the SafeC toolchain (compiler, safeguard, sc-lsp) for macOS, Linux,
# and Windows, packages each as an installable archive, and — on a version
# tag push — publishes them as GitHub Release assets. Also runnable by hand
# (workflow_dispatch) to validate the build matrix without cutting a release.
#
# Each platform job is independent and best-effort documented inline; see
# the Windows job's comments for the history of environment-specific issues
# that had to be worked through there (LLVM acquisition, MSVC-vs-GCC compile
# flags, etc.) before it reached parity with macOS/Linux.
#
# Platform floor: the macOS binaries and prebuilt std run on macOS 11.0 and
# later, the Linux ones on glibc 2.25 and later. Both jobs build LLVM's
# libraries themselves for that (build-llvm.sh, cached): Homebrew's are built
# for the runner's macOS, apt.llvm.org's against Ubuntu's current glibc. The
# Linux binaries are built in a manylinux2014 container (glibc 2.17); each
# job checks the result (check-macos-min.py, check-glibc.py).
#
# Tag patterns accept both 'v1.2.3' and '1.2.3'-style tags (no required 'v'
# prefix) — this project's actual releases use the latter (e.g.
# '1.0.0-beta'), and the release job's own gate below matches the same way.

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch: {}

env:
  # CodeGen.cpp uses Module::setTargetTriple(Triple)/getTargetTriple()
  # returning Triple (not std::string), the Triple-overload of
  # TargetRegistry::lookupTarget, and Intrinsic::getOrInsertDeclaration
  # (which fully replaced getDeclaration — no back-compat alias) — all of
  # which landed in LLVM's API somewhere between v18 and v21/22 and simply
  # don't exist on older LLVM. 21 is this project's documented minimum
  # (see docs/advanced/compiler.md); a CI run against 18 confirmed the
  # hard way that the minimum is a real requirement, not a suggestion.
  LLVM_VERSION: "21"
  # The LLVM source release build-llvm.sh builds for the macOS and Linux
  # binaries (the Windows job's SDK archive is the same version).
  LLVM_PKG_VERSION: "21.1.8"

jobs:
  # ── macOS (Apple Silicon) ────────────────────────────────────────────────
  macos:
    runs-on: macos-14
    timeout-minutes: 300
    env:
      # Everything compiled and linked here -- LLVM, safec, safeguard,
      # sc-lsp, and the prebuilt std (which 'safeguard std-prebuilt' builds
      # for 11.0 anyway) -- runs on macOS 11 and later.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout SafeC
        uses: actions/checkout@v4
        with:
          path: SafeC

      - name: Checkout sc-language-server
        uses: actions/checkout@v4
        with:
          repository: safec-org/sc-language-server
          path: sc-language-server

      - name: Install LLVM
        # Homebrew's clang (any current one is >= this project's minimum) is
        # what the smoke test and the std prebuilt compile safec's IR with.
        # Its libraries are built for the runner's macOS, so safec links
        # the ones build-llvm.sh builds for 11.0 instead (next steps).
        # lld: wasm-ld, for safec-doc's wasm32 search client (package.sh).
        run: brew install llvm lld ninja

      - name: Cache LLVM libraries (macOS 11.0)
        uses: actions/cache@v4
        with:
          path: llvm-install
          key: llvm-${{ env.LLVM_PKG_VERSION }}-macos-arm64-11.0-${{ hashFiles('SafeC/.github/scripts/build-llvm.sh') }}

      - name: Build LLVM libraries (macOS 11.0)
        run: bash SafeC/.github/scripts/build-llvm.sh "$LLVM_PKG_VERSION" "$GITHUB_WORKSPACE/llvm-install"

      - name: Build safec compiler
        run: |
          set -o pipefail
          LLVM_DIR="$GITHUB_WORKSPACE/llvm-install/lib/cmake/llvm"
          # Static LLVM: the published safec must not need a libLLVM.dylib.
          cmake -S SafeC/compiler -B SafeC/compiler/build \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$LLVM_DIR" -DSAFEC_STATIC_LLVM=ON \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"
          cmake --build SafeC/compiler/build -j "$(sysctl -n hw.ncpu)" 2>&1 | tee build-safec.log
          if otool -L SafeC/compiler/build/safec | grep -i 'libLLVM'; then
            echo "::error::safec links libLLVM dynamically"; exit 1
          fi
          otool -L SafeC/compiler/build/safec

      - name: Build safeguard
        run: |
          set -o pipefail
          cmake -S SafeC/safeguard -B SafeC/safeguard/build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"
          cmake --build SafeC/safeguard/build -j "$(sysctl -n hw.ncpu)" 2>&1 | tee build-safeguard.log

      - name: Build sc-lsp
        run: |
          set -o pipefail
          cmake -S sc-language-server -B sc-language-server/build \
            -DCMAKE_BUILD_TYPE=Release -DSAFEC_DIR="$GITHUB_WORKSPACE/SafeC/compiler" \
            -DLLVM_DIR="$GITHUB_WORKSPACE/llvm-install/lib/cmake/llvm" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET"
          cmake --build sc-language-server/build -j "$(sysctl -n hw.ncpu)" 2>&1 | tee build-sc-lsp.log

      - name: Check the binaries run on macOS 11.0
        # Their own minimum, and no linker warning that something linked in
        # was built for a newer macOS (which the minimum alone can't show).
        run: |
          # ld64: "object file (...) was built for newer 'macOS' version (14.0)
          # than being linked (11.0)", "... dylib ... which was built for
          # newer version 14.0".
          if grep -hE "built for newer ('?macOS'? )?version" build-*.log; then
            echo "::error::an object or library linked into a release binary is built for a newer macOS than $MACOSX_DEPLOYMENT_TARGET"; exit 1
          fi
          python3 SafeC/.github/scripts/check-macos-min.py --max "$MACOSX_DEPLOYMENT_TARGET" \
            SafeC/compiler/build/safec SafeC/safeguard/build/safeguard sc-language-server/build/sc-lsp

      - name: Smoke test before packaging
        run: bash SafeC/.github/scripts/smoke-test.sh
        env:
          SAFEC_BIN: ${{ github.workspace }}/SafeC/compiler/build/safec
          SAFEGUARD_BIN: ${{ github.workspace }}/SafeC/safeguard/build/safeguard
          SC_LSP_BIN: ${{ github.workspace }}/sc-language-server/build/sc-lsp
          SAFEC_HOME: ${{ github.workspace }}/SafeC
          CLANG_BIN: clang

      - name: Package
        # bin/, std/, README.md and lib/<triple>/std/<section>.a: std
        # prebuilt for this platform, one archive per section, by the
        # packaged safec (see package.sh), which a native build links
        # instead of compiling std. The std objects must run on 11.0 too.
        # Also bin/safec-doc and share/safec/doctool ('safeguard doc').
        run: |
          set -euo pipefail
          OUT="safec-macos-arm64"
          bash SafeC/.github/scripts/package.sh "$OUT" SafeC/compiler/build/safec \
            SafeC/safeguard/build/safeguard sc-language-server/build/sc-lsp
          python3 SafeC/.github/scripts/check-macos-min.py --max "$MACOSX_DEPLOYMENT_TARGET" "$OUT"/lib/*/std/*.a
          tar czf "${OUT}.tar.gz" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: safec-macos-arm64
          path: safec-macos-arm64.tar.gz
          if-no-files-found: error

  # ── Linux (x86_64) ────────────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout SafeC
        uses: actions/checkout@v4
        with:
          path: SafeC

      - name: Checkout sc-language-server
        uses: actions/checkout@v4
        with:
          repository: safec-org/sc-language-server
          path: sc-language-server

      - name: Cache LLVM libraries (manylinux2014)
        uses: actions/cache@v4
        with:
          path: llvm-install
          key: llvm-${{ env.LLVM_PKG_VERSION }}-manylinux2014-x86_64-${{ hashFiles('SafeC/.github/scripts/build-llvm.sh') }}

      - name: Build safec, safeguard and sc-lsp for glibc 2.17+ (manylinux2014 container)
        # CentOS 7's glibc 2.17 is what the binaries link against, so they
        # import no newer symbol version and run on glibc >= 2.25 (and
        # older); LLVM's libraries are built there too (build-llvm.sh,
        # cached), and libstdc++ is linked statically. See
        # build-linux-release.sh.
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/w" -w /w quay.io/pypa/manylinux2014_x86_64 \
            bash /w/SafeC/.github/scripts/build-linux-release.sh /w "$LLVM_PKG_VERSION"

      - name: Check the binaries run on glibc 2.25
        run: |
          python3 SafeC/.github/scripts/check-glibc.py --max 2.25 \
            SafeC/compiler/build/safec SafeC/safeguard/build/safeguard sc-language-server/build/sc-lsp
          if ldd SafeC/compiler/build/safec | grep -iE 'libLLVM|libstdc\+\+|libz|libtinfo|libzstd'; then
            echo "::error::safec links a library a user's machine may lack"; exit 1
          fi
          ldd SafeC/compiler/build/safec

      - name: Install LLVM
        # The clang the smoke test and the std prebuilt compile safec's IR
        # with, and llvm-nm & co. for the checks. (safec doesn't link it.)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y "clang-${{ env.LLVM_VERSION }}" "llvm-${{ env.LLVM_VERSION }}" "lld-${{ env.LLVM_VERSION }}"

      - name: Smoke test before packaging
        run: bash SafeC/.github/scripts/smoke-test.sh
        env:
          SAFEC_BIN: ${{ github.workspace }}/SafeC/compiler/build/safec
          SAFEGUARD_BIN: ${{ github.workspace }}/SafeC/safeguard/build/safeguard
          SC_LSP_BIN: ${{ github.workspace }}/sc-language-server/build/sc-lsp
          SAFEC_HOME: ${{ github.workspace }}/SafeC
          CLANG_BIN: clang-${{ env.LLVM_VERSION }}

      - name: Package
        # bin/, std/, README.md and lib/<triple>/std/<section>.a: std
        # prebuilt for this platform, one archive per section, by the
        # packaged safec (see package.sh), which a native build links
        # instead of compiling std. Its objects must link with glibc 2.25:
        # each glibc function they call must exist there (check-glibc.py
        # --objects looks them up in this runner's glibc).
        run: |
          set -euo pipefail
          OUT="safec-linux-x86_64"
          bash SafeC/.github/scripts/package.sh "$OUT" SafeC/compiler/build/safec \
            SafeC/safeguard/build/safeguard sc-language-server/build/sc-lsp
          NM="llvm-nm-${{ env.LLVM_VERSION }}" python3 SafeC/.github/scripts/check-glibc.py --max 2.25 \
            --objects "$OUT"/lib/*/std/*.a
          tar czf "${OUT}.tar.gz" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: safec-linux-x86_64
          path: safec-linux-x86_64.tar.gz
          if-no-files-found: error

  # ── Windows (x86_64) ──────────────────────────────────────────────────────
  # Two source-level portability fixes were needed before this job could
  # even be attempted (safeguard's process-spawning code used POSIX
  # fork()/execvp()/waitpid() directly with no Windows path, and three files
  # used popen()/pclose() instead of MSVC's _popen()/_pclose()) — both are
  # now behind '#ifdef _WIN32' in the SafeC/safeguard sources. LLVM
  # acquisition went through several real, CI-verified rounds — Chocolatey,
  # then vcpkg — before landing on downloading LLVM.org's own prebuilt SDK
  # archive directly (see the "Install LLVM (official prebuilt SDK archive)"
  # step below), each prior approach failing in a distinct way across
  # multiple real CI runs before diagnostics showed it wasn't going to work.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout SafeC
        uses: actions/checkout@v4
        with:
          path: SafeC

      - name: Checkout sc-language-server
        uses: actions/checkout@v4
        with:
          repository: safec-org/sc-language-server
          path: sc-language-server

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install LLVM (official prebuilt SDK archive)
        # See the matching, more detailed comment in ci.yml. Short version:
        # Chocolatey's llvm package never shipped LLVMConfig.cmake (wrong
        # artifact). vcpkg's llvm port is pinned to v18.1.6 in the registry
        # snapshot available here — below this project's documented 21+
        # minimum — with no way to request a different port version in
        # classic mode. LLVM.org's own GitHub releases publish a second
        # Windows archive alongside the installer for exactly this case:
        # 'clang+llvm-<version>-x86_64-pc-windows-msvc.tar.xz' is prebuilt
        # (download+extract, no from-source build time/disk risk) and
        # contains the full headers/libs/CMake config needed to link
        # against libLLVM. Version pinned to 21.1.8 to match LLVM_VERSION
        # used on Linux and this project's documented minimum.
        shell: bash
        run: |
          set -euo pipefail
          LLVM_PKG_VERSION="21.1.8"
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_PKG_VERSION}/clang+llvm-${LLVM_PKG_VERSION}-x86_64-pc-windows-msvc.tar.xz"
          curl -fL -o llvm-sdk.tar.xz "$URL"
          mkdir -p /c/llvm-sdk
          tar -xf llvm-sdk.tar.xz -C /c/llvm-sdk

          FOUND="$(find /c/llvm-sdk -iname 'LLVMConfig.cmake' | head -1)"
          if [[ -z "$FOUND" ]]; then
            echo "::error::LLVMConfig.cmake not found after extracting the official LLVM SDK archive."
            echo "-- top-level contents of /c/llvm-sdk --"
            ls -la /c/llvm-sdk
            exit 1
          fi
          echo "Found: $FOUND"
          echo "LLVM_CMAKE_DIR=$(dirname "$FOUND")" >> "$GITHUB_ENV"

      - name: Work around LLVM's hardcoded DIA SDK path (llvm/llvm-project#86250)
        # See the matching, more detailed comment in ci.yml. LLVM.org's
        # official Windows release archives hardcode an absolute path to
        # diaguids.lib from whatever VS install built that release into
        # LLVMExports.cmake — a long-standing, still-unfixed upstream bug
        # (llvm/llvm-project#86250, #100372, #152268) present through LLVM
        # 22.x, so no version pin avoids it. Confirmed community workaround:
        # fabricate that exact fake path and populate it with a copy of
        # whatever DIA SDK actually exists on this runner's own VS install
        # (safec never calls into LLVMDebugInfoPDB, so which copy doesn't
        # matter — it only needs to exist to satisfy the link step).
        shell: bash
        run: |
          set -euo pipefail
          SRC="$(find "/c/Program Files" "/c/Program Files (x86)" -maxdepth 6 -type d -iname 'DIA SDK' 2>/dev/null | head -1)"
          if [[ -z "$SRC" ]]; then
            echo "::error::Could not locate this runner's own DIA SDK (searched under Program Files and Program Files (x86)) to work around llvm/llvm-project#86250."
            exit 1
          fi
          DEST="/c/Program Files (x86)/Microsoft Visual Studio/2019/Professional"
          mkdir -p "$DEST"
          cp -r "$SRC" "$DEST/DIA SDK"
          echo "Copied DIA SDK from '$SRC' to '$DEST/DIA SDK'"

      - name: Build safec compiler
        shell: bash
        run: |
          cmake -S SafeC/compiler -B SafeC/compiler/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="$LLVM_CMAKE_DIR"
          cmake --build SafeC/compiler/build

      - name: Build safeguard
        shell: bash
        run: |
          cmake -S SafeC/safeguard -B SafeC/safeguard/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build SafeC/safeguard/build

      - name: Build sc-lsp
        shell: bash
        run: |
          cmake -S sc-language-server -B sc-language-server/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DSAFEC_DIR="$GITHUB_WORKSPACE/SafeC/compiler"
          cmake --build sc-language-server/build

      - name: Smoke test before packaging
        shell: bash
        run: bash SafeC/.github/scripts/smoke-test.sh
        env:
          SAFEC_BIN: ${{ github.workspace }}/SafeC/compiler/build/safec.exe
          SAFEGUARD_BIN: ${{ github.workspace }}/SafeC/safeguard/build/safeguard.exe
          SC_LSP_BIN: ${{ github.workspace }}/sc-language-server/build/sc-lsp.exe
          SAFEC_HOME: ${{ github.workspace }}/SafeC
          CLANG_BIN: clang

      - name: Package
        shell: bash
        # As on macOS/Linux: lib/x86_64-pc-windows-msvc/std/<section>.a too.
        run: |
          set -euo pipefail
          OUT="safec-windows-x86_64"
          bash SafeC/.github/scripts/package.sh "$OUT" SafeC/compiler/build/safec.exe \
            SafeC/safeguard/build/safeguard.exe sc-language-server/build/sc-lsp.exe
          7z a "${OUT}.zip" "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: safec-windows-x86_64
          path: safec-windows-x86_64.zip
          if-no-files-found: error

  # ── Publish a GitHub Release (tag pushes only) ───────────────────────────
  # Bare 'refs/tags/' (no 'v' requirement) so this matches both tag
  # conventions the workflow trigger above accepts — a workflow_dispatch
  # run's ref is 'refs/heads/<branch>', which never matches, so manual runs
  # still correctly skip publishing (the "validate without releasing" case
  # from the top-of-file comment) without needing a separate check for it.
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for softprops/action-gh-release to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/safec-macos-arm64/safec-macos-arm64.tar.gz
            dist/safec-linux-x86_64/safec-linux-x86_64.tar.gz
            dist/safec-windows-x86_64/safec-windows-x86_64.zip
          generate_release_notes: true
          # A tag with a hyphen ('v1.0.0-beta-4', '1.0.0-rc1') is a pre-release.
          prerelease: ${{ contains(github.ref_name, '-') }}
